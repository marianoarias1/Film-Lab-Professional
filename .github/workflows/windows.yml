name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust stable
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: windows-native-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'third-party/patches/**') }}
          restore-keys: windows-native-${{ runner.arch }}-
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm run test:native
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: FilmLab-Professional-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
